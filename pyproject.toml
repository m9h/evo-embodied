[project]
name = "evo-embodied"
version = "0.1.0"
description = "Modern evolutionary robotics environment: MuJoCo + MJX + JAX replacing pyrosim/pybullet"
requires-python = ">=3.12"
dependencies = [
    # Matched physics versions, validated with the corrected model settings.
    "mujoco==4.0.0",
    "mujoco-mjx==4.0.0",
    "jax>=0.12.0.1,<0.13",
    "jaxlib>=0.12.0.1,<0.13",
    "numpy>=2.5.4,<3",
    "matplotlib>=3.11.2,<4",
    "mediapy>=1.2.7,<2",
    "jupyterlab>=4.6.6,<5",
    "ipywidgets>=8.1.9,<9",
    "ipykernel>=7.4.0,<8",
]

[project.optional-dependencies]
gpu = ["jax[cuda13]>=0.12.0.1,<0.13; sys_platform == 'linux'"]
strategies = ["evosax>=0.3.2,<0.4"]
rl = ["brax==0.14.2", "dm_control==1.0.51"]
# Playground 1.0 moves to PyTorch/Warp; preserve the JAX/MJX baseline.
demos = ["playground==0.2.0", "onnxruntime>=1.31.1,<2"]
llm = ["openai>=3.46.0,<4"]
full = ["evo-embodied[gpu,strategies,rl,demos,llm]"]
