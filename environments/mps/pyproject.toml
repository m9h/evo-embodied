[project]
name = "evo-embodied-mps-check"
version = "0.1.0"
description = "Isolated experimental Apple GPU compatibility checks"
requires-python = ">=3.12,<3.14"
dependencies = [
    # StableHLO compatibility: keep the plugin and JAX/jaxlib on 0.11.1.
    "jax-mps==0.11.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "mujoco==3.6.0",
    "mujoco-mjx==3.6.0",
    "numpy==2.5.4",
]
